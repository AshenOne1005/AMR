# Pretrain configs for all datasets. Select with: --config config/pretrain.yaml --cfg-name <dataset>
# Each entry lists the full union of varying fields (overrides _base_).
_base_: _base_/pretrain.yaml

ntu60_xsub:
  train_dataset_args:
    data_path: your_data_path
  batch_size: 128
  lr: 1e-3
  min_lr: 5e-4
  mask_ratio: 0.9
  motion_aware_tau: 0.80


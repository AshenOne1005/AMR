# Linear-probe configs for all datasets. Select with: --config config/linprobe.yaml --cfg-name <dataset>
# Each entry lists the full union of varying fields (overrides _base_).
_base_: _base_/linprobe.yaml

ntu60_xsub:
  train_dataset_args:
    data_path: your_data_path
  val_dataset_args:
    data_path: your_data_path
  model_args:
    num_classes: 60
  batch_size: 64
  lr: 0.003

